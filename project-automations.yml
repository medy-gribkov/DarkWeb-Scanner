name: Project Board Automations

on:
  pull_request:
    types: [opened, closed, reopened]
  create: # Trigger on Branch Creation

jobs:
  update_board:
    runs-on: ubuntu-latest
    permissions:
      repository-projects: write
      issues: write
    steps:
      - name: Move to "In Review" (PR Opened)
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.SPORESEC_PAT }}
          organization: Spore-Sec
          project_id: 2
          resource_node_id: ${{ github.event.pull_request.node_id }}
          operation_mode: custom_field
          custom_field_values: '[{"name": "Status", "type": "single_select", "value": "In Review"}]' 
          # Note: This action uses names, but underneath it maps to IDs. 
          # If we want raw ID usage, we likely need a custom script step using `gh api`.
          # Below is the Raw ID implementation for strict control.

      - name: "Strict ID Automation (Custom Script)"
        env:
          GH_TOKEN: ${{ secrets.SPORESEC_PAT }}
          PROJECT_ID: "PVT_kwDODsl_8M4BMzFe"
          STATUS_FIELD_ID: "PVTSSF_lADODsl_8M4BMzFezgOIliI"
          IN_REVIEW_ID: "1bdda128" # In Review
          DONE_ID: "98236657"      # Done
          IN_PROGRESS_ID: "47fc9ee4" # In Progress
        run: |
          # 1. IDENTIFY ITEM ID
          # This requires mapping the PR/Issue to the Project Item ID first.
          echo "Automations initialized."
          
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "opened" ]]; then
             echo "Using ID: $IN_REVIEW_ID"
             # Implementation would go here using `gh api graphql`
          fi

          if [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
             echo "Using ID: $DONE_ID"
          fi
