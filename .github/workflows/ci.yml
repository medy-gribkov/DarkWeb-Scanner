name: CI Guardrails

on:
  pull_request:
    branches: [ "main", "develop", "production" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # Build Guard (JS/TS) for frontend folder.
    - name: Install Frontend dependencies
      working-directory: frontend
      run: npm ci
      if: hashFiles('frontend/package-lock.json') != ''

    - name: Build Frontend
      working-directory: frontend
      run: npm run build
      if: hashFiles('frontend/package.json') != ''

    # Test Guard (Go)
    - name: Run Go Tests
      run: go test -v ./...
      if: hashFiles('go.mod') != ''
