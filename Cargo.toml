[package]
name = "sporesec-darkweb-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["socks", "json"] }
tokio = { version = "1.42", features = ["full"] }
scraper = "0.22"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
actix-web = "4"
actix-cors = "0.6"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
dialoguer = "0.10"
subtle = "2.4"
jsonwebtoken = "8"
prometheus = "0.14"
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1.21"
rand = "0.8"
base64 = "0.21"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
mockito = "0.31"